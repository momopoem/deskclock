<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="36" font-weight="700" fill="#000000">DeskSideClock タッチ操作領域（通常画面）</text>
  <rect x="180" y="110" width="800" height="600" rx="18" fill="#111827" stroke="#000000" stroke-width="5"/>
  <text x="580" y="160" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="28" fill="#ffffff">画面座標で判定（矩形は描画ごとに更新）</text>
  <rect x="240" y="195" width="680" height="64" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="4"/>
  <text x="580" y="237" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="29" font-weight="700" fill="#111827">① 天気アイコン　テーマを切替</text>
  <rect x="240" y="278" width="300" height="86" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/>
  <text x="390" y="323" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="27" font-weight="700" fill="#111827">② 日付</text>
  <text x="390" y="352" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="21" fill="#111827">カレンダーを開く</text>
  <rect x="620" y="278" width="300" height="86" rx="10" fill="#ddd6fe" stroke="#7c3aed" stroke-width="4"/>
  <text x="770" y="323" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="27" font-weight="700" fill="#111827">③ 時刻</text>
  <text x="770" y="352" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="21" fill="#111827">12/24時間表示を切替</text>
  <rect x="240" y="385" width="300" height="64" rx="10" fill="#bae6fd" stroke="#0284c7" stroke-width="4"/>
  <text x="390" y="425" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="22" fill="#111827">④ 左の空気値　eCO2 ↔ 気圧</text>
  <rect x="620" y="385" width="300" height="64" rx="10" fill="#bae6fd" stroke="#0284c7" stroke-width="4"/>
  <text x="770" y="425" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="22" fill="#111827">⑤ 右の空気値　TVOC ↔ CO2</text>
  <rect x="240" y="470" width="300" height="105" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="4"/>
  <text x="390" y="510" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="27" font-weight="700" fill="#111827">⑥ 室内</text>
  <text x="390" y="538" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="18" fill="#111827">SHT20 → AHT21</text>
  <text x="390" y="562" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="18" fill="#111827">→ SwitchBot → BME280</text>
  <rect x="620" y="470" width="300" height="105" rx="10" fill="#fecdd3" stroke="#e11d48" stroke-width="4"/>
  <text x="770" y="510" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="27" font-weight="700" fill="#111827">⑦ 室外</text>
  <text x="770" y="550" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="20" fill="#111827">SwitchBot ↔ Open-Meteo</text>
  <rect x="240" y="600" width="680" height="56" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/>
  <text x="580" y="636" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="22" fill="#111827">⑧ その他の通常画面領域：テーマ色を変更</text>
  <line x1="1010" y1="200" x2="1090" y2="200" stroke="#111827" stroke-width="4"/>
  <text x="1120" y="190" font-family="Meiryo, sans-serif" font-size="26" font-weight="700" fill="#111827">表示ON / DIM</text>
  <text x="1120" y="230" font-family="Meiryo, sans-serif" font-size="24" fill="#111827">上記の領域を操作可能</text>
  <line x1="1010" y1="370" x2="1090" y2="370" stroke="#111827" stroke-width="4"/>
  <text x="1120" y="360" font-family="Meiryo, sans-serif" font-size="26" font-weight="700" fill="#111827">カレンダー表示中</text>
  <text x="1120" y="400" font-family="Meiryo, sans-serif" font-size="24" fill="#111827">前月 / 翌月が最優先</text>
  <line x1="1010" y1="540" x2="1090" y2="540" stroke="#111827" stroke-width="4"/>
  <text x="1120" y="530" font-family="Meiryo, sans-serif" font-size="26" font-weight="700" fill="#111827">表示OFF</text>
  <text x="1120" y="570" font-family="Meiryo, sans-serif" font-size="24" fill="#111827">タッチ入力を無効化</text>
  <text x="1120" y="608" font-family="Meiryo, sans-serif" font-size="24" fill="#111827">前回の押下状態は持ち越さない</text>
  <text x="800" y="830" text-anchor="middle" font-family="Meiryo, sans-serif" font-size="22" fill="#374151">図10-1　現行 v2.4.0 実装に基づくタッチ操作領域と表示変化</text>
</svg>
